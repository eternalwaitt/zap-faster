# Zap Faster as a Flatpak, built from source: the manifest Flathub builds
# from. The copy in the Flathub repository names a tag and its commit in
# the source below and carries cargo-sources.json next to it; flathub.sh
# writes both. For a local build, this one takes the checkout as it is:
#
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/io.github.eternalwaitt.ZapFaster.yml
#
# The release workflow does not build from source twice: it packages the
# binary the Linux job already built, through the bundle manifest beside
# this one, whose finish-args are the same as these.
id: io.github.eternalwaitt.ZapFaster
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: zap-faster
finish-args:
  # Wayland first, X11 when that is what there is.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Sound: PulseAudio, which PipeWire also answers.
  - --socket=pulseaudio
  # WhatsApp and attachment downloads.
  - --share=network
  # Archive key and status notifier tray.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  # Older Flatpak versions leave XDG_STATE_HOME unset. Keep the fallback
  # state directory (session, history, logs, and credential markers) durable.
  - --persist=.local/state
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/zap-faster/cargo
    # The crate ships bindings for its pinned whisper.cpp revision.
    # The Flatpak sandbox has no libclang, so use those supported bindings.
    WHISPER_DONT_GENERATE_BINDINGS: '1'
modules:
  - name: zap-faster
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked
      - install -Dm755 target/release/zap-faster /app/bin/zap-faster
      - install -Dm644 packaging/applications/*.desktop /app/share/applications/io.github.eternalwaitt.ZapFaster.desktop
      - sed -i 's/^Icon=.*$/Icon=io.github.eternalwaitt.ZapFaster/;s/^StartupWMClass=zap-faster$/StartupWMClass=io.github.eternalwaitt.ZapFaster/' /app/share/applications/io.github.eternalwaitt.ZapFaster.desktop
      - install -Dm644 packaging/icons/zap-faster.svg /app/share/icons/hicolor/scalable/apps/io.github.eternalwaitt.ZapFaster.svg
      - install -Dm644 packaging/flatpak/io.github.eternalwaitt.ZapFaster.metainfo.xml /app/share/metainfo/io.github.eternalwaitt.ZapFaster.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/zap-faster/LICENSE
    sources:
      - type: dir
        path: ../..
      # Supply the current app ID even when generating a manifest for an older tag.
      - type: file
        path: io.github.eternalwaitt.ZapFaster.metainfo.xml
        dest: packaging/flatpak
      # Every crate the lockfile names, for the offline build; flathub.sh
      # writes it with flatpak-cargo-generator.
      - cargo-sources.json
