# Shared CLI: gem install native-packages --version 0.8.1
---
schema: 1
tool:
  version: 0.8.1
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use ALSA's t64 package name.
libraries:
  libasound.so.2:
    deb: libasound2t64
    rpm: alsa-lib
nfpm:
  name: zap-faster
  maintainer: eternalwaitt
  homepage: https://github.com/eternalwaitt/zap-faster
  description: Fast native WhatsApp client
  license: MIT
  provides: [zap-faster]
  conflicts: [zapfast, fastsapp]
  replaces: []
  contents:
  - src: "@PAYLOAD@/zap-faster-v@VERSION@-@TARGET@/zap-faster"
    dst: "/usr/bin/zap-faster"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/zap-faster-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/zap-faster/LICENSE"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zap-faster-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/zap-faster/README.md"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zap-faster-v@VERSION@-@TARGET@/packaging/applications/zap-faster.desktop"
    dst: "/usr/share/applications/zap-faster.desktop"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zap-faster-v@VERSION@-@TARGET@/packaging/icons/zap-faster.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/zap-faster.svg"
    file_info:
      mode: 420
  - src: contrib/omarchy/zap-faster.json.tpl
    dst: /usr/share/zap-faster/omarchy/zap-faster.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/zap-faster-theme
    dst: /usr/share/zap-faster/omarchy/zap-faster-theme
    file_info:
      mode: 493
  overrides:
    deb:
      depends:
      - libc6 (>= 2.39)
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64
      - libasound2-plugins
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - glibc >= 2.39
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - alsa-plugins-pulseaudio
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'zap-faster-@TAG@-macos-universal.dmg'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/zap-faster-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: zap-faster-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/zap-faster-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: zap-faster-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: eternalwaitt/zap-faster
  checksums: checksums.txt
  prereleases: true
assets:
  AMD64:
    file: zap-faster-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/zap-faster-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: zap-faster-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/zap-faster-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  MACOS:
    file: zap-faster-v@VERSION@-macos-universal.dmg
    local: dist/zap-faster-v@VERSION@-macos-universal.dmg
  SOURCE:
    file: zap-faster-@VERSION@.tar.gz
    url: https://github.com/eternalwaitt/zap-faster/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/zap-faster-@VERSION@.tar.gz
templates:
  homebrew/zap-faster.rb: packaging/homebrew/zap-faster.rb.in
  arch/zap-faster/PKGBUILD: packaging/arch/zap-faster/PKGBUILD.in
  arch/zap-faster/zap-faster.install: packaging/arch/zap-faster.install
  arch/zap-faster-bin/PKGBUILD: packaging/arch/zap-faster-bin/PKGBUILD.in
  arch/zap-faster-bin/zap-faster-bin.install: packaging/arch/zap-faster.install
  arch/zap-faster-git/PKGBUILD: packaging/arch/zap-faster-git/PKGBUILD.in
  arch/zap-faster-git/zap-faster-git.install: packaging/arch/zap-faster.install
version_file: Cargo.toml
